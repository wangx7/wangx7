{% extends "base.html" %}
{% block title %}发新帖子 - 论坛{% endblock %}

{% block content %}
<div class="form-page">
  <h1>🖊️ 发新帖子</h1>

  {% if error %}
    <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="post" class="post-form">
    <div class="form-group">
      <label for="title">帖子标题 <span class="required">*</span></label>
      <input type="text" id="title" name="title" placeholder="请输入帖子标题" required />
    </div>
    <div class="form-group">
      <label for="author">昵称</label>
      <input type="text" id="author" name="author" placeholder="匿名用户（留空使用默认）" />
    </div>
    <div class="form-group">
      <label for="content">帖子内容 <span class="required">*</span></label>
      <textarea id="content" name="content" rows="10"
                placeholder="在这里写下帖子内容…" required></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">📤 发布帖子</button>
      <a class="btn btn-outline" href="{{ url_for('forum') }}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
