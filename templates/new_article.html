{% extends "base.html" %}
{% block title %}发表新文章{% endblock %}

{% block content %}
<div class="form-page">
  <h1>✏️ 发表新文章</h1>

  {% if error %}
    <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="post" class="post-form">
    <div class="form-group">
      <label for="title">文章标题 <span class="required">*</span></label>
      <input type="text" id="title" name="title" placeholder="请输入文章标题" required />
    </div>
    <div class="form-group">
      <label for="author">作者</label>
      <input type="text" id="author" name="author" placeholder="博主（留空使用默认）" />
    </div>
    <div class="form-group">
      <label for="content">文章内容 <span class="required">*</span></label>
      <textarea id="content" name="content" rows="14"
                placeholder="在这里写下您的文章内容…" required></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">📤 发布文章</button>
      <a class="btn btn-outline" href="{{ url_for('index') }}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
